<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark only">
  <link rel="icon" href="/favicon.ico">
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a1224">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="3d-world">
  <meta name="description" content="Build a tower of cannons and crates, survive endless waves of siege, and rebuild it taller every run.">
  <link rel="manifest" href="/manifest.json">
  <link rel="preload" as="image" href="/images/logo/logo_256x256.webp" type="image/webp">
  <title>3d-world</title>
  <style>
      /* The splash paints before any JS runs, so its colours are inlined here
         rather than pulled from the app's stylesheet. They match the scene's
         night-sky background so the handover to the canvas is seamless — no
         flash of a differently-coloured page. */
      body {
          margin: 0;
          background-color: #0a1224;
          outline: none;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at 50% 38%, #1b2b52 0%, #0a1224 70%);
          transition: opacity 0.4s ease-out;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      /* A procedurally-drawn "tower" built from CSS boxes: three stacked
         blocks that pulse in sequence. Zero bytes, and it previews the game's
         actual subject matter instead of a generic spinner. */
      .splash-tower {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.6vmin;
      }

      .splash-tower i {
          display: block;
          width: 9vmin;
          height: 9vmin;
          border: 0.7vmin solid #0f1a30;
          border-radius: 1.4vmin;
          background-image: linear-gradient(160deg, #d99a53, #a9682f 45%, #6b3f1d);
          box-shadow: inset 0 0.8vmin 0 rgba(255, 255, 255, 0.22);
          animation: splash-block 1.4s ease-in-out infinite;
      }

      .splash-tower i:nth-child(2) { animation-delay: 0.16s; }
      .splash-tower i:nth-child(3) {
          animation-delay: 0.32s;
          background-image: linear-gradient(160deg, #7a63ad, #4b3d70 45%, #2a2140);
      }

      @keyframes splash-block {
          0%, 100% { opacity: 0.35; transform: translateY(0); }
          50%      { opacity: 1;    transform: translateY(-0.8vmin); }
      }
  </style>
</head>
<body>
<div id="static-splash">
  <div class="splash-tower" role="img" aria-label="3d-world">
    <i></i><i></i><i></i>
  </div>
</div>
<!-- Load the SDK before your game code -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<!-- Load the SDK before your game code -->
<script src="https://bridge.playgama.com/v1/stable/playgama-bridge.js"></script>
<!-- Load the SDK before your game code -->
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
