  <style>
      /* The splash paints before any JS runs, so its colours are inlined here
         rather than pulled from the app's stylesheet. They match the scene's
         night-sky background so the handover to the canvas is seamless — no
         flash of a differently-coloured page. */
      body {
          margin: 0;
          background-color: #0a1224;
          outline: none;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at 50% 38%, #1b2b52 0%, #0a1224 70%);
          transition: opacity 0.4s ease-out;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      /* Arlaan's arms, inline. Zero bytes over the wire and it paints
         before any JS runs, so the loading screen is already the game's own
         mark rather than a generic spinner. The paths are a copy of
         `src/components/atoms/ArlaanLogo.vue` — index.html cannot import a
         Vue component, and the point of copying them rather than simplifying
         is that the handover static splash -> Vue splash -> canvas shows the
         SAME drawing at the SAME size, with nothing swapping under the
         player. If the mark is ever redrawn, both files change.

         40vmin matches `FLogoProgress`'s `min(vw, vh) * 0.4` box exactly, so
         the two logos are the same size in the same place and the handover is
         invisible. */
      .splash-arms {
          width: 40vmin;
          height: 40vmin;
          animation: splash-breathe 2.4s ease-in-out infinite;
      }

      @keyframes splash-breathe {
          0%, 100% { opacity: 0.82; transform: scale(0.985); }
          50%      { opacity: 1;    transform: scale(1); }
      }
  </style>
</head>
