<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark only">
  <link rel="icon" href="/favicon.ico">
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3a2416">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="aethel-fold">
  <meta name="description" content="Fold the pages of a pop-up book to crush a paper army, topple its castle and fold its dragon into a frog.">
  <link rel="manifest" href="/manifest.json">
  <title>Aethel Fold</title>
  <style>
      /* The splash paints before any JS runs, so its colours are inlined here
         rather than pulled from the app's stylesheet. They match the scene's
         night-sky background so the handover to the canvas is seamless — no
         flash of a differently-coloured page. */
      body {
          margin: 0;
          background-color: #3a2416;
          outline: none;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at 50% 38%, #8a5a36 0%, #3a2416 70%);
          transition: opacity 0.4s ease-out;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      .splash-stack {
          position: relative;
          width: 40vmin;
          height: 40vmin;
      }

      .splash-logo {
          width: 100%;
          height: 100%;
          display: block;
          animation: splash-breathe 2.4s ease-in-out infinite;
      }

      /* The paper strip progress bar (same metrics as FLogoProgress.vue). */
      .splash-bar {
          position: absolute;
          top: calc(100% + clamp(0.5rem, 2.5vmin, 1.25rem));
          left: 50%;
          width: clamp(10rem, 44vmin, 22rem);
          transform: translateX(-50%);
          display: flex;
      }

      .splash-bar__track {
          position: relative;
          flex: 1 1 auto;
          height: clamp(0.9rem, 3vmin, 1.4rem);
          border: 3px solid #1c1724;
          border-radius: 0.15rem;
          overflow: hidden;
          background: linear-gradient(to bottom, #fff6e3 0 50%, #f4e7c9 50% 100%);
          box-shadow: 0 4px 0 rgba(76, 64, 120, 0.45);
      }

      .splash-bar__fill {
          width: 0;
          height: 100%;
          border-right: 2px solid #1c1724;
          background: linear-gradient(to bottom, #ff6a5c 0 52%, #d8433b 52% 100%);
      }

      @keyframes splash-breathe {
          0%, 100% { transform: translateY(0) scale(0.985); }
          50%      { transform: translateY(-2%) scale(1); }
      }
  </style>
</head>
<body>
<div id="static-splash">
  <!-- Same layout as FLogoProgress.vue (logo box 40vmin, paper bar under it)
       so the handover to the Vue splash is invisible. The logo is the
       rasterised logoArt.ts (scripts/render-logo.mjs). -->
  <div class="splash-stack">
    <img class="splash-logo" src="images/logo/logo_512x512.png" alt="Aethel Fold" width="512" height="512" decoding="async" fetchpriority="high">
    <div class="splash-bar"><div class="splash-bar__track"><div class="splash-bar__fill" id="splash-fill"></div></div></div>
  </div>
</div>
<!-- Boot progress before any module runs (a file, not inline: the CSP has
     no 'unsafe-inline' for scripts). See public/boot.js. -->
<script src="boot.js"></script>
<!-- Load the SDK before your game code -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<!-- Load the SDK before your game code -->
<script src="https://bridge.playgama.com/v1/stable/playgama-bridge.js"></script>
<!-- Load the SDK before your game code -->
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
