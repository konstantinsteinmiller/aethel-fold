<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark only">
  <link rel="icon" href="/favicon.ico">
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3a2416">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="aethel-fold">
  <meta name="description" content="Fold the pages of a pop-up book to crush a paper army, topple its castle and fold its dragon into a frog.">
  <link rel="manifest" href="/manifest.json">
  <title>Castle Fold</title>
  <style>
      /* The splash paints before any JS runs, so its colours are inlined here
         rather than pulled from the app's stylesheet. They match the scene's
         night-sky background so the handover to the canvas is seamless — no
         flash of a differently-coloured page. */
      body {
          margin: 0;
          background-color: #3a2416;
          outline: none;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at 50% 38%, #8a5a36 0%, #3a2416 70%);
          transition: opacity 0.4s ease-out;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      /* The paper crane, inline. Zero bytes over the wire and it paints
         before any JS runs. The facets are a copy of
         `src/components/atoms/GameLogo.vue` (without the wordmark: the
         'Angry' font is not loaded yet) — index.html cannot import a Vue
         component, and copying keeps the handover static splash -> Vue
         splash showing the same crane at the same size. If the mark is ever
         redrawn, both files change.

         40vmin matches `FLogoProgress`'s `min(vw, vh) * 0.4` box exactly, so
         the two logos are the same size in the same place and the handover is
         invisible. */
      .splash-arms {
          width: 40vmin;
          height: 40vmin;
          animation: splash-breathe 2.4s ease-in-out infinite;
      }

      @keyframes splash-breathe {
          0%, 100% { opacity: 0.82; transform: scale(0.985); }
          50%      { opacity: 1;    transform: scale(1); }
      }
  </style>
</head>
<body>
<div id="static-splash">
  <svg class="splash-arms" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Castle Fold" focusable="false"><g fill="#1c1724" stroke="#1c1724" stroke-width="10" stroke-linejoin="round"><polygon points="60,30 112,122 90,128"/><polygon points="60,30 128,122 112,122"/><polygon points="196,30 144,122 166,128"/><polygon points="196,30 128,122 144,122"/><polygon points="90,130 106,134 40,64"/><polygon points="36,60 52,66 28,94"/><polygon points="166,130 150,134 226,70"/><polygon points="84,128 128,118 128,178"/><polygon points="128,118 172,128 128,178"/></g><g stroke="#1c1724" stroke-width="2.5" stroke-linejoin="round"><polygon points="60,30 112,122 90,128" fill="#3464d6"/><polygon points="60,30 128,122 112,122" fill="#5f95ff"/><polygon points="196,30 144,122 166,128" fill="#5f95ff"/><polygon points="196,30 128,122 144,122" fill="#3464d6"/><polygon points="90,130 106,134 40,64" fill="#ff6a5c"/><polygon points="36,60 52,66 28,94" fill="#ffe066"/><polygon points="166,130 150,134 226,70" fill="#d8433b"/><polygon points="84,128 128,118 128,178" fill="#fff6e3"/><polygon points="128,118 172,128 128,178" fill="#e7d3a8"/></g></svg>
</div>
<!-- Load the SDK before your game code -->

</body>
</html>
